<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no, shrink-to-fit=yes">
  <meta name="theme-color" content="#06111a">
  <meta name="description" content="Play Celeste online on GameHub.">
  <title>Celeste</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="prefetch" id="mountainsrc" href="assets/mountain.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="gamehub-loading-theme.css">
  <style>
    html, body { background: #000; }
    #loading-textt { position: fixed; inset: 0; z-index: 99999; text-align: center; pointer-events: none; }
  </style>
  
<!-- Fullscreen is controlled by the GameHub player. -->

  <script src="cfg.js"></script>
  <script src="data.js"></script>

<style id="gamehub-touch-style">
  html, body, body * { -webkit-tap-highlight-color: rgba(0,0,0,0) !important; }
  html, body, canvas { -webkit-touch-callout: none !important; touch-action: manipulation; }
  html, body, canvas, img, a, button, iframe, [role="button"] { -webkit-user-select: none !important; user-select: none !important; }
  input, textarea, select, [contenteditable="true"] { -webkit-user-select: text !important; user-select: text !important; }
  *, *::before, *::after { outline: 0 !important; -webkit-focus-ring-color: transparent !important; }
  *:focus, *:focus-visible, canvas:active, canvas:focus { outline: 0 !important; box-shadow: none !important; }
  ::selection { background: transparent !important; color: inherit !important; }
</style>
</head>
<body>
  <div id="loading-textt" class="gamehub-loading" style="--gamehub-load-accent: #ffd400;" role="status" aria-live="polite">
    <div id="status-text">Loading game...</div>
    <div id="bar-container" aria-hidden="true"><div id="bar-fill"></div></div>
    <div id="progress-detail">0.00 MB / 681.43 MB</div>
    <div id="error-box"></div>
  </div>
  <!-- Local web port source: https://github.com/web-ports/celeste -->
  <script>
    (() => {
      const totalBytes = 714532328;
      let loadedBytes = 0;
      const status = document.getElementById('status-text');
      const bar = document.getElementById('bar-fill');
      const detail = document.getElementById('progress-detail');
      const overlay = document.getElementById('loading-textt');
      const notifyParent = (state, message) => { if (window.parent !== window) window.parent.postMessage({ gamehub: 'game-status', state, message: message || '' }, '*'); };
      const formatMB = bytes => `${(bytes / 1048576).toFixed(2)} MB`;
      const render = (message, suffix = '') => {
        const complete = Math.min(loadedBytes, totalBytes);
        status.textContent = message;
        detail.textContent = suffix || `${formatMB(complete)} / ${formatMB(totalBytes)}`;
        bar.style.width = `${Math.min(100, complete / totalBytes * 100)}%`;
      };
      window.gamehubLoading = {
        addNative(bytes) { loadedBytes += bytes; render('Preparing game runtime'); },
        addData(bytes, index, total) { loadedBytes += bytes; render(`Downloading game files (${index}/${total})`); },
        setStage(message) { render(message); },
        complete() { loadedBytes = totalBytes; render('Ready'); notifyParent('ready'); setTimeout(() => { overlay.style.display = 'none'; }, 250); },
        error(message) { status.textContent = 'Could not start Celeste'; document.getElementById('error-box').textContent = message || 'Refresh the page to try again.'; document.getElementById('error-box').style.display = 'block'; notifyParent('error', message || 'Could not start Celeste'); }
      };
      render('Loading game...');
      window.addEventListener('error', () => window.gamehubLoading.error(), { once: true });
      window.addEventListener('unhandledrejection', () => window.gamehubLoading.error(), { once: true });
    })();
  </script>
  <script type="module" src="bundle.js"></script>
<script id="gamehub-touch-behavior">
(() => {
  const clearTransientTouchState = () => {
    if (window.getSelection) window.getSelection().removeAllRanges();
    const active = document.activeElement;
    if (active && active !== document.body && !/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
  };
  document.addEventListener('pointerup', clearTransientTouchState, { capture: true, passive: true });
  document.addEventListener('touchend', clearTransientTouchState, { capture: true, passive: true });
})();
</script></body>
</html>
